# MediaMTX Configuration
# This handles RTSP ingestion and WebRTC streaming for the dashboard.
api: yes
apiAddress: :9997

# Disable authentication entirely for development
authMethod: internal
authInternalUsers:
  - user: any
    pass: ""
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api
      - action: metrics
      - action: pprof

webrtc: yes
webrtcAddress: :8189
webrtcLocalUDPAddress: :8189
webrtcAdditionalHosts: [127.0.0.1, 192.168.1.6, 106.201.231.217]

paths:
  all_others:
    source: publisher
