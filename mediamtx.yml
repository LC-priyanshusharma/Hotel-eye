# MediaMTX Configuration
# This handles RTSP ingestion and WebRTC streaming for the dashboard.
api: yes
apiAddress: :9997

# Disable authentication entirely for development
authMethod: internal
authInternalUsers:
  - user: any
    pass: ""
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api
      - action: metrics
      - action: pprof

webrtc: yes
webrtcAddress: :8189
webrtcAllowOrigins:
  - '*'
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcAdditionalHosts:
  - 106.201.231.217
  - 127.0.0.1
  - localhost

paths:
  all_others:

