ocr:
  provider: "easyocr"
  local_model_path: "models/awiros"
  download_if_missing: true
  use_gpu: false
  confidence_threshold: 0.02
  fallback_provider: "easyocr"

plate_detector:
  provider: "indian_yolo"
  model_path: "indian_plate_yolo.pt"
  confidence_threshold: 0.40

validation:
  smart_repair_enabled: true
  repair_confidence_threshold: 0.85
  format_strategies:
    - "private"
    - "commercial"
    - "ev"
    - "diplomatic"
    - "military"
    - "bh_series"

fusion:
  min_observations: 1
  track_timeout_seconds: 1.5
  weighted_voting: true

enhancement:
  clahe_clip_limit: 2.0
  denoise_h: 30
  quality_threshold: 0.75
