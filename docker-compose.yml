services:
  timescaledb:
    image: pgvector/pgvector:pg15
    environment:
      - POSTGRES_DB=cctv
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    ports:
      - "8554:8554"
      - "8189:8189/tcp"
      - "8189:8189/udp"
      - "9997:9997"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml

  deepstream:
    build: ./deepstream
    runtime: nvidia
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./deepstream:/app/deepstream
    working_dir: /app/deepstream
    command: python3 pipeline.py
    depends_on:
      - redis

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:admin@timescaledb:5432/cctv
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=super-secret-key-1234
    depends_on:
      - timescaledb
      - redis
    volumes:
      - ./backend/snapshots:/app/snapshots

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  timescaledb_data:
